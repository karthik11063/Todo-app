<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Todo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="text-center mb-4">
        <h1 class="fw-bold text-primary">📝 Todo Application</h1>
        <p class="text-muted">Stay organized and get things done</p>
    </div>

    <!-- Add Task Form -->
    <form action="/" method="post" class="row justify-content-center mb-4">
        <div class="col-md-8 col-sm-10 mb-2">
            <input class="form-control form-control-lg shadow-sm" type="text" name="title"
                   placeholder="Add a new task..." required>
        </div>
        <div class="col-md-2 col-sm-10">
            <button type="submit" class="btn btn-lg btn-primary w-100 shadow-sm">Add Task</button>
        </div>
    </form>

    <!-- Task List -->
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3 text-secondary">Your Tasks</h5>

            <!-- Empty message -->
            <div th:if="${#lists.isEmpty(tasks)}" class="text-center text-muted">
                No tasks yet. Add one above!
            </div>

            <!-- Tasks -->
            <th:block th:each="task : ${tasks}">
                <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                    <span th:text="${task.title}"
                          th:classappend="${task.completed} ? 'text-success text-decoration-line-through' : 'text-secondary'"
                          class="fs-5 fw-medium"></span>

                    <div class="d-flex gap-2">
                        <a th:href="@{/{id}/toggle(id=${task.id})}"
                           class="btn btn-sm"
                           th:classappend="${task.completed} ? 'btn-outline-success' : 'btn-outline-secondary'">
                            <span th:text="${task.completed} ? 'Completed' : 'Mark Done'"></span>
                        </a>

                        <a th:href="@{/{id}/delete(id=${task.id})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Are you sure you want to delete this task?');">
                            Delete
                        </a>
                    </div>
                </div>
            </th:block>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
